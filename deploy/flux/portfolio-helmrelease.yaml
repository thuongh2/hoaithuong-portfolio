apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portfolio
  namespace: flux-system
spec:
  interval: 10m
  releaseName: portfolio
  targetNamespace: portfolio
  chart:
    spec:
      chart: ./deploy/helm/portfolio
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: true
  values:
    imagePullSecrets:
      - name: ghcr-pull-secret
